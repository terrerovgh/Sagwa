services:
  muse-life:
    build: .
    ports:
      - "192.168.4.64:8765:8765"
    environment:
      MUSE_LIFE_TOKEN: ${MUSE_LIFE_TOKEN:?local token required}
      MUSE_PUBLIC_URL: http://192.168.4.64:8765
    volumes:
      - resources:/cache
    restart: unless-stopped
    mem_limit: 2g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  resources:
